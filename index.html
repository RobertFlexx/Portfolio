<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#161616">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Systems programming, terminal tools, games, and graphics by Robert Flexx.">
    <meta property="og:title" content="Robert Flexx | Systems Developer">
    <meta property="og:description" content="Operating systems, terminal tools, games, and graphics. A selection of projects by Robert Flexx.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github.com/RobertFlexx">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script>
      (function syncBirthdayThemes() {
        const now = new Date();
        const birthdayThemes = [
          {
            className: "moritisimor-birthday",
            month: 7,
            day: 28,
            timeZone: "Europe/Berlin"
          },
          { className: "kokonico-birthday", month: 10, day: 24 },
          { className: "robert-birthday", month: 11, day: 21 }
        ];

        birthdayThemes.forEach(({ className, month, day, timeZone }) => {
          let currentMonth = now.getMonth() + 1;
          let currentDay = now.getDate();

          if (timeZone) {
            const dateParts = new Intl.DateTimeFormat("en-US", {
              timeZone,
              month: "numeric",
              day: "numeric"
            }).formatToParts(now);
            const partValue = (type) =>
              Number(dateParts.find((part) => part.type === type).value);

            currentMonth = partValue("month");
            currentDay = partValue("day");
          }

          const isBirthday = currentMonth === month && currentDay === day;
          document.documentElement.classList.toggle(className, isBirthday);
        });

        const nextMinute = 60000 - (now.getTime() % 60000) + 50;
        window.setTimeout(
          syncBirthdayThemes,
          nextMinute
        );
      })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <title>Robert Flexx | Systems Developer</title>
  </head>
  <body>
    <noscript>This portfolio needs JavaScript enabled to start the Elm application.</noscript>
    <div id="app"></div>
    <script src="main.js"></script>
    <script>
      const app = Elm.Main.init({ node: document.getElementById("app") });

      fetch("github-data.json", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) {
            throw new Error(`GitHub snapshot request failed: ${response.status}`);
          }

          return response.json();
        })
        .then((snapshot) => app.ports.githubDataReceived.send(snapshot))
        .catch((error) => {
          console.warn("Using the built-in GitHub snapshot fallback.", error);
        });
    </script>
  </body>
</html>
