<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#161616">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Systems programming, terminal tools, games, and graphics by Robert Flexx.">
    <meta property="og:title" content="Robert Flexx | Systems Developer">
    <meta property="og:description" content="Operating systems, terminal tools, games, and graphics. A selection of projects by Robert Flexx.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github.com/RobertFlexx">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script>
      (function watchBirthdayThemes() {
        const birthdayThemes = [
          { className: "moritisimor-birthday", month: 7, day: 28 },
          { className: "kokonico-birthday", month: 10, day: 24 },
          { className: "robert-birthday", month: 11, day: 21 }
        ];
        let refreshTimer;

        function syncBirthdayThemes() {
          window.clearTimeout(refreshTimer);
          const now = new Date();

          birthdayThemes.forEach(({ className, month, day }) => {
            const isBirthday = now.getMonth() + 1 === month && now.getDate() === day;
            document.documentElement.classList.toggle(className, isBirthday);
          });

          const nextMidnight = new Date(now);
          nextMidnight.setHours(24, 0, 0, 0);
          const nextCheck = Math.max(50, Math.min(60000, nextMidnight - now + 50));
          refreshTimer = window.setTimeout(syncBirthdayThemes, nextCheck);
        }

        window.addEventListener("focus", syncBirthdayThemes);
        window.addEventListener("pageshow", syncBirthdayThemes);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") syncBirthdayThemes();
        });
        syncBirthdayThemes();
      })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <title>Robert Flexx | Systems Developer</title>
  </head>
  <body>
    <noscript>This portfolio needs JavaScript enabled to start the Elm application.</noscript>
    <div id="app"></div>
    <script src="main.js"></script>
    <script type="module">
      import { startGithubSync } from "./github-data.mjs";

      const app = Elm.Main.init({ node: document.getElementById("app") });
      startGithubSync((snapshot) => app.ports.githubDataReceived.send(snapshot));
    </script>
  </body>
</html>
