name: Deploy portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site/assets _site/vendor/raylib-wasm
          cp index.html main.js styles.css favicon.svg raylib.html raylib.css raylib-game.js source.html _site/
          cp assets/raylib-logo.png _site/assets/
          cp vendor/raylib-wasm/raylib.js vendor/raylib-wasm/raylib.wasm vendor/raylib-wasm/raylib_emscripten.js vendor/raylib-wasm/raylib_wc.js vendor/raylib-wasm/LICENSE _site/vendor/raylib-wasm/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
